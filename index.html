<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#1f2556" />
    <title>Казкова стежка</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2246%22 fill=%22%23f4b23f%22/%3E%3Ccircle cx=%2236%22 cy=%2242%22 r=%226%22/%3E%3Ccircle cx=%2264%22 cy=%2242%22 r=%226%22/%3E%3Cpath d=%22M34 62 q16 14 32 0%22 stroke=%22%23000%22 stroke-width=%225%22 fill=%22none%22/%3E%3C/svg%3E" />
    <meta name="description" content="Українські народні казки, у яких дитина сама вибирає, що буде далі." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="library" class="screen library">
      <header class="library-head">
        <button class="moon" id="moon" aria-label="Оновити сторінку"></button>
        <h1>Казкова стежка</h1>
        <p>Обери казку — і вирішуй, що буде далі!</p>
        <div class="head-pills">
          <span class="purse" id="purse" aria-label="Монетки"></span>
          <button class="pill" id="btn-heroes"><span class="pill-icon" aria-hidden="true">👫</span>Мої герої</button>
        </div>
      </header>
      <div class="shelf" id="shelf"></div>
      <!-- a tale's card: opened from the shelf, the narrator tells what it is about -->
      <div id="tale-card" class="tale-card" hidden>
        <div class="tale-card-box" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="tc-title">
          <button id="tc-close" class="tc-close" aria-label="Закрити">✕</button>
          <div id="tc-art" class="book-art tc-art"></div>
          <div class="tc-text">
            <h2 id="tc-title"></h2>
            <p id="tc-about"></p>
            <div id="tc-endings" class="book-endings"></div>
            <button id="tc-play" class="tc-play">▶&#xFE0E; Слухати казку</button>
          </div>
        </div>
      </div>
    </main>

    <main id="heroes" class="screen library heroes" hidden>
      <header class="heroes-head">
        <button id="heroes-back" class="round" aria-label="До казок">🏠</button>
        <div class="heroes-title">
          <h1>Мої герої</h1>
          <div class="heroes-count" id="heroes-count"></div>
        </div>
        <span class="purse" id="heroes-purse" aria-label="Монетки"></span>
      </header>
      <div class="hero-grid" id="hero-grid"></div>
      <!-- one hero: hello, and the wardrobe -->
      <div id="hero-card" class="tale-card hero-card" hidden>
        <div class="tale-card-box hero-box" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="hero-name">
          <button id="hero-close" class="tc-close" aria-label="Закрити">✕</button>
          <div class="hero-view" id="hero-view"></div>
          <div class="hero-side">
            <div class="hero-top">
              <h2 id="hero-name"></h2>
              <span class="purse small" id="hero-purse"></span>
            </div>
            <label class="dress-toggle">
              <input type="checkbox" id="hero-dressed" />
              <span class="switch" aria-hidden="true"></span>
              <span>Вбрання</span>
            </label>
            <div class="items" id="hero-items"></div>
            <button id="hero-buy" class="tc-play buy" disabled>Купити</button>
          </div>
        </div>
      </div>
    </main>

    <section id="play" class="screen play" hidden>
      <div id="stage-host" class="stage-host"></div>
      <div class="topbar">
        <div class="topbar-left">
          <button id="btn-home" class="round" aria-label="До казок">🏠</button>
          <!-- shown in a tale with an ending found, or in every tale in DEBUG=TRUE builds -->
          <button id="btn-back" class="round debug" aria-label="Попередня репліка" hidden>⏮</button>
          <button id="btn-next" class="round debug" aria-label="Наступна репліка" hidden>⏭</button>
        </div>
        <div class="topbar-right">
          <button id="btn-pause" class="round" aria-label="Пауза">⏸</button>
          <button id="btn-sound" class="round" aria-label="Звук">🔊</button>
        </div>
      </div>
      <div id="choices" class="choices" hidden></div>
      <div id="caption" class="caption" hidden>
        <div class="who" id="caption-who"></div>
        <div class="text" id="caption-text"></div>
      </div>
      <div id="curtain" class="curtain"></div>
      <button id="paused" class="paused" hidden aria-label="Продовжити">
        <span class="paused-play">▶</span>
        <span class="paused-label">Пауза — натисни, щоб слухати далі</span>
      </button>
      <div id="ending" class="ending" hidden>
        <div class="ending-card">
          <div class="ornament"></div>
          <div class="ending-icon" id="ending-icon"></div>
          <div class="ending-label">Кінцівка</div>
          <h2 id="ending-title"></h2>
          <div class="found" id="ending-found"></div>
          <div class="found-note" id="ending-note"></div>
          <div class="reward" id="ending-reward" hidden></div>
          <div class="ending-buttons">
            <button id="btn-again" class="big">🔁 Ще раз</button>
            <button id="btn-library" class="big ghost">🏠 До казок</button>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
