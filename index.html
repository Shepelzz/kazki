<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f6e7c8" />
    <title>Казкова стежка</title>
    <meta name="description" content="Українські народні казки, у яких дитина сама вибирає, що буде далі." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="library" class="screen library">
      <header class="library-head">
        <div class="ornament"></div>
        <h1>Казкова стежка</h1>
        <p>Слухай казку — і вибирай, що буде далі!</p>
      </header>
      <div class="shelf" id="shelf"></div>
      <div class="ornament"></div>
    </main>

    <section id="play" class="screen play" hidden>
      <div id="stage-host" class="stage-host"></div>
      <div class="topbar">
        <button id="btn-home" class="round" aria-label="До казок">🏠</button>
        <button id="btn-sound" class="round" aria-label="Звук">🔊</button>
      </div>
      <div id="choices" class="choices" hidden></div>
      <div id="caption" class="caption" hidden>
        <div class="who" id="caption-who"></div>
        <div class="text" id="caption-text"></div>
      </div>
      <div id="curtain" class="curtain"></div>
      <div id="ending" class="ending" hidden>
        <div class="ending-card">
          <div class="ornament"></div>
          <div class="ending-icon" id="ending-icon"></div>
          <div class="ending-label">Кінцівка</div>
          <h2 id="ending-title"></h2>
          <div class="found" id="ending-found"></div>
          <div class="found-note" id="ending-note"></div>
          <div class="ending-buttons">
            <button id="btn-again" class="big">🔁 Ще раз</button>
            <button id="btn-library" class="big ghost">🏠 До казок</button>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
