services:
  - type: web
    name: kazki
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      # hashed JS/CSS bundles never change under the same URL
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # recordings are asked for with a fingerprint of the file (?v=…), so a re-recorded phrase is a new URL
      - path: /voice/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
