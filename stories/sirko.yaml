# Сірко — казка з вибором. Головна лінія — як у народній казці (kazky.org.ua); відгалуження — на виборах.
# Кроки ті самі, що в інших казках (див. шапки kolobok.yaml, rukavychka.yaml, pan-kotskyi.yaml).
#
# Після зміни текстів: npm run voice:all (Леся + ElevenLabs).

title: Сірко
cover: sirko

voices:
  narrator: { name: "", pitch: 1.1, rate: 1 }
  sirko:    { name: "Сірко", pitch: 0.85, rate: 0.95 }
  did:      { name: "Хазяїн", pitch: 0.72, rate: 0.9 }
  baba:     { name: "Хазяйка", pitch: 1.0, rate: 0.95 }
  vovk:     { name: "Вовк", pitch: 0.68, rate: 0.95 }
  nevista:  { name: "Молода", pitch: 1.2, rate: 1 }
  lysytsia: { name: "Лисиця", pitch: 1.18, rate: 0.9 }

endings:
  friends: { title: "Сірко і вовк", icon: "🤝" }
  guard:   { title: "Вірний сторож", icon: "🌙" }
  dance:   { title: "Вовк на весіллі", icon: "💃" }
  sleep:   { title: "Сонний вовк", icon: "😴" }

start: start

scenes:
  start:
    - scene: hata
    - show: did
      at: [1060, 770]
    - show: baba
      at: [1270, 770]
    - show: sirko
      at: [780, 770]
      flip: true
    - narrator: "Привіт! Сьогодні я розповім тобі казку про старого пса Сірка. А ти допомагатимеш вибирати, що буде далі."
    - narrator: "Був у одного чоловіка собака Сірко. Довго він служив хазяїнові, а тепер уже такий старий став, що й гавкати не годен."
    - did: "Ет, Сірко, нема з тебе вже ніякої користі. Іди собі з двору!"
    - sirko: "Гав... За що ж мене, хазяїне? Я ж тобі стільки літ вірно служив..."
    - narrator: "Та хазяїн і слухати не схотів. Прогнав Сірка з двору."
    - move: sirko
      to: [-300, 770]
      ms: 3200
      wait: true
    - next: field_edge

  field_edge:
    - scene: glade
    - show: bush
      at: [520, 790]
    - show: sirko
      at: [700, 770]
    - narrator: "Пішов бідний Сірко в поле, ліг під кущем та й журиться: що ж його тепер робити?"
    - fx: lie
      on: sirko
    - narrator: "Аж тут вибігає з лісу вовк."
    - show: vovk
      at: [1800, 770]
    - move: vovk
      to: [1020, 770]
      ms: 2200
      wait: true
    - vovk: "Чого ти, Сірко, тут лежиш, такий сумний?"
    - sirko: "Та як же мені не журитися, вовче? Прогнав мене хазяїн, бо старий я став."
    - vovk: "Не журися, я тобі поможу. Завтра твої хазяї підуть жито жати, а дитинку покладуть під копою. Я вхоплю дитину й понесу, а ти біжи за мною, ніби відбираєш. Я дитину кину, а ти принесеш її назад. От тоді хазяїн тебе знову й прийме!"
    - choice: "Що скаже Сірко?"
      options:
        - label: "«Згода, вовче!»"
          icon: "🤝"
          next: agree
        - label: "«Ні, обманювати не буду»"
          icon: "🙅"
          next: refuse

  agree:
    - move: sirko
      to: [700, 770]
      ms: 1
      wait: true
    - sirko: "Згода, вовче! Спасибі тобі, що не покинув у біді."
    - narrator: "Так і домовилися."
    - next: harvest

  harvest:
    - scene: zhnyva
    - show: snip
      at: [460, 770]
    - show: dytyna
      at: [560, 770]
    - show: did
      at: [1020, 770]
    - show: baba
      at: [1240, 770]
    - narrator: "Другого дня вийшли хазяї в поле жито жати. А дитинку поклали під копою, в холодочку."
    - did: "Жни, жінко, жни, поки сонечко не припекло!"
    - narrator: "Аж тут — звідки не візьмись — вовк! Вхопив дитину та й бігом."
    - show: vovk
      at: [-250, 770]
      flip: true
    - move: vovk
      to: [520, 770]
      flip: true
      ms: 1500
      wait: true
    - carry: dytyna
      by: vovk
    - fx: whoosh
      on: vovk
    - baba: "Ой, лишенько! Вовк дитину вхопив! Рятуйте!"
    - show: sirko
      at: [-250, 770]
      flip: true
    - move: vovk
      to: [1560, 770]
      flip: true
      ms: 2200
    - move: sirko
      to: [1360, 770]
      flip: true
      ms: 2600
      wait: true
    - narrator: "А Сірко — за ним! Біжить, гавкає, наздоганяє..."
    - put: dytyna
      to: [1460, 770]
      ms: 400
    - move: vovk
      to: [2050, 770]
      flip: true
      ms: 1200
    - narrator: "Кинув вовк дитину — та й у ліс. А Сірко підхопив дитинку й несе назад, до хазяїв."
    - move: sirko
      to: [1440, 770]
      flip: true
      ms: 600
      wait: true
    - carry: dytyna
      by: sirko
    - move: sirko
      to: [1380, 770]
      flip: false
      ms: 1500
      wait: true
    - put: dytyna
      to: [1320, 770]
      ms: 400
    - baba: "Ой, Сірко, рятівнику наш! Нашу дитинку врятував!"
    - did: "Ну, Сірко, прости мене, старого дурня. Ходи додому — житимеш у нас у теплі й шані, доки віку твого!"
    - next: home

  home:
    - scene: hata-evening
    - show: did
      at: [1060, 770]
    - show: baba
      at: [1270, 770]
    - show: sirko
      at: [760, 770]
      flip: true
    - show: halushky
      at: [640, 770]
    - narrator: "Привели Сірка додому, нагодували галушками зі сметаною, ще й місце біля печі постелили."
    - fx: hearts
      on: sirko
    - next: wolf_comes

  wolf_comes:
    - scene: hata-night
    - show: sirko
      at: [880, 770]
    - narrator: "Минув якийсь час. Аж якось уночі прибігає до двору вовк."
    - show: vovk
      at: [1850, 770]
    - move: vovk
      to: [1200, 770]
      ms: 2200
      wait: true
    - vovk: "Ну що, Сірко, я тобі поміг — тепер ти мені віддяч. Голодно мені в лісі, хоч вий."
    - sirko: "Добре, куме. Якраз завтра в хазяїна весілля — дочку заміж віддає. Приходь увечері, я тебе нагодую й напою."
    - next: wedding

  wedding:
    - scene: pich-evening
    - show: stil
      at: [900, 800]
    - show: nevista
      at: [1330, 770]
    - show: did
      at: [1490, 770]
    - show: baba
      at: [640, 770]
    - show: sirko
      at: [520, 770]
      flip: true
    - narrator: "Гуляє весілля! Музики грають, гості танцюють, молода у вінку з барвистими стрічками."
    - nevista: "Ой, які гості! Ой, яке весілля!"
    - narrator: "А вовк тим часом тихенько прокрався до хати — та й під стіл."
    - show: vovk
      at: [-250, 770]
      flip: true
    - move: vovk
      to: [1180, 770]
      flip: true
      ms: 2200
      wait: true
    - move: vovk
      to: [1180, 770]
      flip: false
      ms: 1
      wait: true
    - fx: lie
      on: vovk
    - sirko: "Сюди, куме, під стіл! Ось тобі ковбаска, ось і пиріжок."
    - narrator: "Носить Сірко вовкові під стіл то ковбаску, то шматок м'яса, то пиріжок, а то й кухлик меду. Наївся вовк, напився — аж повеселішав."
    - vovk: "Ох, Сірко, як мені добре! А тепер би й заспівати!"
    - sirko: "Не співай, куме, бо біду накличеш!"
    - choice: "Що зробить Сірко?"
      options:
        - label: "Хай заспіває"
          icon: "🎵"
          next: song
        - label: "Познайомити з гостями"
          icon: "💃"
          next: dance
        - label: "Дати ще ковбаски"
          icon: "🌭"
          next: sleep

  song:
    - vovk: "Ау-у-у-у! Ау-у-у!"
      sing: true
    - fx: bang
      on: vovk
      word: "АУ-У!"
    - did: "Вовк! Вовк під столом! Бийте його!"
    - baba: "Ой, рятуйте, людоньки!"
    - sirko: "Стривайте, я його сам!"
    - narrator: "Кинувся Сірко на вовка, ніби хоче його подерти, а сам — потихеньку до дверей, та й вивів його з хати."
    - move: sirko
      to: [1100, 770]
      ms: 600
      wait: true
    - move: vovk
      to: [-300, 770]
      ms: 1600
    - move: sirko
      to: [-200, 770]
      ms: 1800
      wait: true
    - scene: hata-night
    - show: vovk
      at: [1100, 770]
    - show: sirko
      at: [820, 770]
      flip: true
    - vovk: "Ну, спасибі тобі, Сірко, за гостину! Наївся я, напився — на цілий рік."
    - sirko: "Ти мені добро зробив, а я тобі віддячив. Тепер ми квити, куме!"
    - move: vovk
      to: [1900, 770]
      flip: true
      ms: 2400
    - narrator: "І розійшлися вони друзями. А Сірко жив у хазяїна в теплі й шані аж до самої старості."
    - fx: hearts
      on: sirko
    - ending: friends

  dance:
    - sirko: "Люди добрі, не бійтеся! Це мій кум вовк. Він добрий — він мені колись дуже поміг!"
    - move: vovk
      to: [1180, 770]
      ms: 1
      wait: true
    - move: vovk
      to: [1300, 770]
      flip: true
      ms: 900
      wait: true
    - baba: "Ой, вовк у хаті!"
    - nevista: "Стривайте! А чи вміє вовк танцювати?"
    - vovk: "А то ж! Гей, музики, грайте гопака!"
    - move: nevista
      to: [1500, 770]
      ms: 600
    - move: vovk
      to: [1300, 770]
      ms: 1
      wait: true
    - fx: tumble
      on: vovk
    - move: vovk
      to: [1300, 770]
      hop: true
      ms: 700
      wait: true
    - fx: tumble
      on: vovk
    - move: vovk
      to: [1300, 770]
      hop: true
      ms: 700
      wait: true
    - fx: sparkle
      on: vovk
    - did: "Ха-ха! Оце так вовк! Оце так гопак!"
    - narrator: "Ото було весілля! Вовк гопака витинав, гості плескали, а молода аж реготала. Довго ще люди згадували, як вовк на весіллі танцював!"
    - fx: hearts
      on: vovk
    - ending: dance

  sleep:
    - sirko: "На, куме, ще ковбаски — тільки мовчи!"
    - narrator: "Наївся вовк так, що аж очі злипаються. Позіхнув — та й заснув під столом."
    - eyes: vovk
      state: closed
    - vovk: "Хр-р-р... Хр-р-р..."
    - did: "Чуєте? Хто це так хропе?"
    - baba: "Та то, мабуть, сват натанцювався!"
    - narrator: "Посміялися гості, та й далі гуляють. А на світанку вовк тихенько виліз з-під столу, подякував Сіркові — та й шусть у ліс."
    - eyes: vovk
      state: open
    - move: vovk
      to: [-300, 770]
      ms: 2200
      wait: true
    - ending: sleep

  refuse:
    - move: sirko
      to: [700, 770]
      ms: 1
      wait: true
    - sirko: "Ні, вовче. Обманювати хазяїв я не буду. Краще ще послужу їм чесно, скільки сили стане."
    - vovk: "Ну, як знаєш, Сірко..."
    - move: vovk
      to: [1900, 770]
      flip: true
      ms: 2000
      wait: true
    - next: guard

  guard:
    - scene: hata-night
    - show: sirko
      at: [880, 770]
    - narrator: "Уночі Сірко потихеньку повернувся до двору й ліг під тином. Аж тут — шурх! — до курника крадеться лисиця."
    - show: lysytsia
      at: [1850, 770]
    - move: lysytsia
      to: [1180, 770]
      ms: 2400
      wait: true
    - sirko: "Гав-гав-гав! А куди це ти, руда, до наших курей?"
    - move: lysytsia
      to: [1950, 770]
      flip: true
      ms: 1300
    - narrator: "Лисиця — навтьоки! А на гавкіт вибіг із хати хазяїн."
    - show: did
      at: [330, 770]
    - move: did
      to: [600, 770]
      ms: 1400
      wait: true
    - did: "Хто тут гавкає? Ти ба — Сірко лисицю від курей прогнав!"
    - show: baba
      at: [330, 770]
    - baba: "Отож, чоловіче! А ти казав, що з нього користі нема."
    - did: "Вибач мені, Сірко. Лишайся — будеш нам двір стерегти, а ми тебе годуватимемо до самої старості."
    - fx: hearts
      on: sirko
    - narrator: "І став Сірко знову жити в дворі. І хоч старий, а таки найвірніший сторож на все село!"
    - ending: guard
