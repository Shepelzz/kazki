# Лисичка і Журавель — казка з вибором. Головна лінія — як у народній казці; відгалуження — на виборах.
# Кроки ті самі, що в інших казках. fx: munch — журавель дзьобає.
#
# Після зміни текстів: npm run voice:all (Леся + ElevenLabs).

title: Лисичка і Журавель
cover: zhuravel

voices:
  narrator: { name: "", pitch: 1.1, rate: 1 }
  lysytsia: { name: "Лисичка", pitch: 1.18, rate: 0.9 }
  zhuravel: { name: "Журавель", pitch: 0.85, rate: 0.95 }

endings:
  canon:   { title: "Як ти мені, так і я тобі", icon: "🏺" }
  fair:    { title: "Чесні сусіди", icon: "🤝" }
  forgive: { title: "Журавель пробачив", icon: "🕊️" }
  peace:   { title: "Спільний пиріг", icon: "🥧" }

start: start

scenes:
  start:
    - scene: polyana
    - show: lysytsia
      at: [700, 770]
      flip: true
    - show: zhuravel
      at: [1120, 770]
    - narrator: "Привіт! Сьогодні — коротка, але дуже мудра казка про лисичку та журавля. А ти вибиратимеш, що буде далі!"
    - narrator: "Подружилася якось лисичка з журавлем. От лисичка й каже:"
    - lysytsia: "Приходь, куме журавлю, до мене в гості — я тебе пригощу!"
    - zhuravel: "Спасибі, кумо, прийду!"
    - narrator: "Наварила лисичка манної каші та й думає, як би того журавля пригостити..."
    - next: fox_dinner

  fox_dinner:
    - scene: polyana
    - show: skatertyna
      at: [800, 786]
    - show: lysytsia
      at: [560, 770]
      flip: true
    - show: zhuravel
      at: [1080, 770]
    - choice: "Як лисичка подасть кашу?"
      options:
        - label: "Розмазати по тарілці"
          icon: "🍽️"
          next: plate
        - label: "Подати так, щоб обом зручно"
          icon: "🤝"
          next: fair

  plate:
    - narrator: "Розмазала лисичка кашу по тарілці — тоненько-тоненько — та й частує:"
    - show: tarilka
      at: [820, 776]
    - lysytsia: "Їж, куме, їж, голубчику! Сама варила!"
    - narrator: "Журавель дзьобом — стук-стук! — стукає по тарілці, а нічого не вхопить."
    - fx: munch
      on: zhuravel
    - narrator: "А лисичка тим часом лиже та лиже — поки всю кашу сама й не з'їла."
    - fx: tumble
      on: lysytsia
    - lysytsia: "Вибачай, куме, більше пригощати нічим."
    - zhuravel: "Спасибі, кумо, й на тому. Приходь же й ти до мене в гості!"
    - next: crane_dinner

  crane_dinner:
    - scene: bereh
    - show: zhuravel
      at: [300, 720]
      flip: true
    - narrator: "Назавтра прийшла лисиця до журавля. А журавель наварив окрошки й думає, як би лисичку пригостити..."
    - show: lysytsia
      at: [-250, 720]
      flip: true
    - move: lysytsia
      to: [120, 720]
      flip: true
      ms: 1600
      wait: true
    - choice: "Як журавель подасть окрошку?"
      options:
        - label: "У глечику з вузьким горлом"
          icon: "🏺"
          next: jug
        - label: "Так, щоб і лисичці зручно"
          icon: "🕊️"
          next: forgive

  jug:
    - narrator: "Налив журавель окрошки в глечик із вузьким горлечком, поставив на стіл та й частує:"
    - show: hlechyk
      at: [220, 722]
    - zhuravel: "Їж, кумо! Правду кажучи, нема чим більше частувати."
    - narrator: "Крутиться лисиця біля глечика: і так зайде, і сяк, і лизне його, і понюхає — та нічого не дістане! Лапа не влазить, морда не влазить."
    - move: lysytsia
      to: [330, 720]
      flip: true
      hop: true
      ms: 600
      wait: true
    - move: lysytsia
      to: [110, 720]
      hop: true
      ms: 600
      wait: true
    - narrator: "А журавель дзьобає та дзьобає — поки все й поїв."
    - fx: munch
      on: zhuravel
    - zhuravel: "Вибачай, кумо, більше пригощати нічим."
    - lysytsia: "Ох і досада! Думала наїстися на цілий тиждень, а додому піду — облизня ковтатиму!"
    - narrator: "Як ти мені, так і я тобі! От тобі й маєш."
    - choice: "Що буде з їхньою дружбою?"
      options:
        - label: "Розійтися"
          icon: "🏺"
          next: canon_end
        - label: "Помиритися"
          icon: "🥧"
          next: peace

  canon_end:
    - move: lysytsia
      to: [-300, 720]
      ms: 2000
      wait: true
    - narrator: "З того часу й дружба лисиці з журавлем — урозтіч. Бо як хто кому, так і той йому!"
    - ending: canon

  peace:
    - zhuravel: "Кумо, а знаєш що? Годі нам одне одного дурити. Спечімо разом великий пиріг — такий, щоб і дзьобом зручно, і мордочкою."
    - lysytsia: "Ох, куме... Твоя правда. Пробач мені за ту кашу."
    - show: pyrih
      at: [220, 722]
    - fx: sparkle
      on: pyrih
    - narrator: "Спекли вони пиріг із яблуками — і їли разом, хто дзьобиком, хто лапкою. І стали знову добрими сусідами."
    - fx: munch
      on: zhuravel
    - fx: hearts
      on: lysytsia
    - ending: peace

  forgive:
    - zhuravel: "Не буду я їй мститися. Налию й собі в глечик, і їй на тарілку — хай обоє наїмося."
    - show: hlechyk
      at: [220, 722]
    - show: tarilka
      at: [130, 724]
    - zhuravel: "Їж, кумо, на здоров'я! Ось тобі тарілочка, а мені — глечик."
    - narrator: "Наїлася лисиця, облизалася — та й засоромилася."
    - lysytsia: "Пробач мені, куме, що я тебе тоді кашею по тарілці пригощала. Ти мене провчив — і без хитрощів."
    - zhuravel: "Та вже пробачаю, кумо. Друзі ж!"
    - fx: hearts
      on: zhuravel
    - narrator: "І з того часу лисичка більше ні з ким не хитрувала за столом. Бо добре слово й добрий приклад навчать краще за будь-яку помсту."
    - ending: forgive

  fair:
    - narrator: "Подумала лисичка: хто ж його знає, як тому журавлеві їсти зручно? Насипала й собі на тарілку, і йому — у високий глечик."
    - show: tarilka
      at: [700, 776]
    - show: hlechyk
      at: [930, 772]
    - lysytsia: "Їж, куме! Тобі в глечику, мені — на тарілці."
    - fx: munch
      on: zhuravel
    - zhuravel: "Ось це по-сусідськи! Спасибі, кумо. Приходь же завтра й ти до мене!"
    - narrator: "Назавтра й журавель так само пригостив лисичку. І дружили вони довго-довго, бо кожен думав про те, як і другові буде зручно."
    - fx: hearts
      on: lysytsia
    - ending: fair
