      to: 1.12
      ms: 500
    - vovk: "Щоб краще тебе чути, онученько!"
    - chervona_shapochka: "Бабусю, а чому у вас такі великі очі?"
    - resize: vovk
      to: 1.18
      ms: 500
    - vovk: "Щоб краще тебе бачити, онученько!"
    - choice: "Ой, щось тут не так! Про що ж іще спитає Червона Шапочка?"
      options:
        - label: "Про великі зуби"
          icon: "🦷"
          next: zuby
        - label: "Про сірий хвіст"
          icon: "🐺"
          next: khvist

  zuby:
    - chervona_shapochka: "Бабусю, а чому у вас такі великі зуби?"
    - resize: vovk
      to: 1.25
      ms: 400
    - vovk: "А це — щоб швидше тебе з'їсти!"
    - narrator: "Вистрибнув вовк із ліжка..."
    - move: vovk
      to: [680, 770]
      hop: true
      ms: 500
      wait: true
    - fx: chomp
      on: vovk
      who: [chervona_shapochka]
    - narrator: "...та й проковтнув Червону Шапочку!"
    - fx: munch
      on: vovk
    - narrator: "Наївся вовк досхочу, ліг знову в ліжко — та й заснув. А тоді як захропе — аж шибки у вікнах задеренчали!"
    - move: vovk
      to: [1060, 770]
      hop: true
      ms: 700
      wait: true
    - fx: doze
      on: vovk
    - fx: bang
      on: vovk
      word: "ХР-Р-Р!"
    - pause: 800
    - next: myslyvtsi

  myslyvtsi:
    - scene: uzlissia
    - show: khatynka_babusi
      at: [1050, 770]
    - fx: tuck
      on: khatynka_babusi
      who: [vovk]
    - show: myslyvets
      at: [-250, 770]
      flip: true
    - show: drovorub
      at: [-460, 770]
      flip: true
    - move: myslyvets
      to: [660, 770]
      ms: 2200
    - move: drovorub
      to: [420, 770]
      ms: 2200
      wait: true
