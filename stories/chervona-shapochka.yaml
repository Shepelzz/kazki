      flip: true
      look: kvity
    - move: chervona_shapochka
      to: [860, 770]
      ms: 2200
      wait: true
    - narrator: "А Червона Шапочка назбирала стільки квітів, що більше й нести не могла. Згадала вона про бабусю — та й поспішила до хатинки."
