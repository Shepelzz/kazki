    - scene: khata-babusi
    - show: lizhko_babusi
      at: [1000, 770]
    - show: vovk
      at: [1060, 770]
      look: babusia
    - show: kovdra
      at: [1000, 770]
    - show: chervona_shapochka
      at: [150, 770]
      flip: true
      look: kvity
