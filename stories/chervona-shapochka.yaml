      on: chervona_shapochka
      who: [khatynka_babusi]
      word: "ТУК-ТУК!"
    - vovk: "Хто там?"
    - narrator: "Почула Червона Шапочка грубий голос — і злякалася було. Та подумала: мабуть, бабуся застудилася, от і захрипла."
    - chervona_shapochka: "Це я, ваша онучка, Червона Шапочка! Пиріжків вам принесла і горщичок масла."
    - narrator: "А вовк — якомога лагідніше:"
    - vovk: "Смикни за мотузочок, дитинко, — двері й відчиняться!"
