# Червона Шапочка — казка з вибором (Шарль Перро, брати Грімм). Головна лінія — як у відомій казці
# (дівчинку всі любили, бабуся подарувала їй червону шапочку — відтоді її звуть Червона Шапочка; мама
# спекла пиріжки й дала горщичок масла: «Віднеси бабусі, вона хворіє. Не барися дорогою і не звертай
# зі стежки!»; у лісі — вовк: «Куди йдеш, Червона Шапочко?» — «До бабусі, несу пиріжки й горщичок
# масла». — «А далеко живе бабуся?» — «За млином, у першій хатинці»; «Піду я цією дорогою, а ти тією —
# подивимось, хто швидше»; Шапочка збирає квіти, ловить метеликів; вовк прибігає першим: «Тук-тук!» —
# «Хто там?» — «Це я, ваша онучка, Червона Шапочка» — «Смикни за мотузочок — двері й відчиняться»;
# вовк проковтнув бабусю, ліг у ліжко в її чепчику; «Бабусю, чому у вас такі великі руки?» — «Щоб
# міцніше тебе обійняти», вуха — «щоб краще тебе чути», очі — «щоб краще тебе бачити», зуби — «А це
# щоб швидше тебе з'їсти!» — і проковтнув Шапочку; заснув і хропе; мисливець із дроворубом почули
# хропіння, розпороли вовкові живіт — бабуся й Шапочка вискочили живі-здорові; набили вовкові живіт
# камінням — вовк прокинувся, хотів утекти, впав і більше не підвівся; бабуся з'їла пиріжки,
# Шапочка пообіцяла більше не звертати зі стежки); відгалуження — на виборах. Кроки ті самі, що в
# інших казках.
#
# Бабуся — та сама baba з «Колобка» (look: chepets — у ліжку, в нічному чепчику й окулярах); вовк —
# vovk (look: babusia — у бабусиному чепчику й окулярах, великі лапи поверх ковдри). Шапочка: look bez
# — ще без шапочки, bez_koshyka — шапочка є, кошика ще нема, kvity — ще й букет квітів. Хатинка
# бабусі (khatynka_babusi) — річ: двері (x − 90) — її «рот», туди входять (enter) і звідти виходять;
# віконце на x + 120, y − 230. Ліжко — дві речі на одному місці: lizhko_babusi (узголів'я й подушка,
# позаду) і kovdra (ковдра, спереду: хто в ліжку — стоїть на x + 60, видно від плечей). Хвіст khvist —
# спереду, з-під ковдри. fx chomp on: вовк who: [хто] — ковтає цілком (хто — всередині); fx popout
# on: вовк who: [...] — вискакують живі. fx doze — засинає, не сідаючи (у ліжку). Нові фони: uzlissia
# (узлісся за млином: млин далеко на пагорбі, ліс праворуч) і khata-babusi (у бабусиній хатинці: двері
# з мотузочком ліворуч на x 66..244, віконце з геранню, годинник із зозулею, рушник над ліжком).
# Звуки за словами (sfx.ts): «ХР-Р-Р!» — хропіння, «ЧИК-ЧИК!» — ножиці.
#
# Після зміни текстів: npm run voice:all (Леся + ElevenLabs).

title: Червона Шапочка
cover: chervona_shapochka_cover
about: "Понесла Червона Шапочка бабусі пиріжки й горщичок масла. Та в лісі на стежці чекав на неї сірий вовк…"

voices:
  narrator:           { name: "", pitch: 1.1, rate: 1 }
  chervona_shapochka: { name: "Червона Шапочка", pitch: 1.45, rate: 1.05, hello: "Привіт! Я Червона Шапочка! Несу бабусі пиріжки. Ходімо разом — тільки стежкою, гаразд?" }
  mama:               { name: "Мама", pitch: 1.05, rate: 1 }
  baba:               { name: "Бабуся", pitch: 1.0, rate: 0.95 }
  vovk:               { name: "Вовк", pitch: 0.68, rate: 0.95 }
  myslyvets:          { name: "Мисливець", pitch: 0.75, rate: 0.95, hello: "Здоров був! Я мисливець. Вовків не боюся, а от бабусині пиріжки — ой, як люблю!" }
  drovorub:           { name: "Дроворуб", pitch: 0.62, rate: 0.9 }

endings:
  stezhka:  { title: "Стежкою до бабусі", icon: "🧺" }
  rozumna:  { title: "Розумна Шапочка", icon: "🤫" }
  zub:      { title: "Бабусин пиріжок", icon: "🦷" }
  khvist:   { title: "Вовчий хвіст", icon: "🐺" }

start: start

scenes:
  start:
    - scene: hata
    - show: chervona_shapochka
      at: [700, 770]
      look: bez
    - show: baba
      at: [1050, 770]
    - narrator: "Привіт! Сьогодні — казка про Червону Шапочку. А ти допомагатимеш їй вибирати, що робити далі!"
    - narrator: "Жила-була в одному селі маленька дівчинка — така гарна та привітна, що всі її любили. А найдужче — бабуся."
    - baba: "Онученько, серденько! Подивися, що я тобі пошила — червону шапочку!"
    - move: baba
      to: [860, 770]
      ms: 1000
      wait: true
    - hide: chervona_shapochka
    - show: chervona_shapochka
      at: [700, 770]
      look: bez_koshyka
    - fx: sparkle
      on: chervona_shapochka
    - chervona_shapochka: "Ой, яка гарна! Дякую, бабусю!"
    - fx: tumble
      on: chervona_shapochka
    - narrator: "Так пасувала дівчинці та червона шапочка, що вона ніде її не знімала. Відтоді всі й стали звати її — Червона Шапочка."
    - fx: hearts
      on: baba
    - baba: "Ну, а мені вже час додому, до лісу. Приходь у гості, онученько!"
    - move: baba
      to: [2000, 770]
      flip: true
      ms: 2600
      wait: true
    - next: pyrizhky

  pyrizhky:
    - scene: pich
    - show: mama
      at: [700, 770]
    - show: koshyk_pyrizhky
      at: [960, 600]
    - show: chervona_shapochka
      at: [1260, 770]
      look: bez_koshyka
    - narrator: "Якось уранці мама розпалила піч і спекла пиріжків — рум'яних, пахучих."
    - fx: flour
      on: mama
    - fx: bake
    - mama: "Червона Шапочко, бабуся захворіла. Віднеси їй пиріжків і оцей горщичок масла."
    - move: mama
      to: [900, 770]
      ms: 900
      wait: true
    - carry: koshyk_pyrizhky
      by: mama
    - move: mama
      to: [1100, 770]
      flip: true
      ms: 900
      wait: true
    - hide: koshyk_pyrizhky
    - hide: chervona_shapochka
    - show: chervona_shapochka
      at: [1260, 770]
    - mama: "Та гляди ж: не барися дорогою і не звертай зі стежки! Бо в лісі всяке буває."
    - chervona_shapochka: "Добре, матусю! Я швиденько!"
    - move: chervona_shapochka
      to: [2000, 770]
      flip: true
      ms: 1600
      wait: true
    - next: lis

  lis:
    - scene: forest
    - show: bush
      at: [1300, 770]
    - show: chervona_shapochka
      at: [-250, 770]
      flip: true
    - move: chervona_shapochka
      to: [560, 770]
      ms: 2400
    - narrator: "Пішла Червона Шапочка до бабусі. А бабуся жила далеко — за лісом, за млином. Іде дівчинка стежкою, наспівує:"
    - chervona_shapochka: "Ля-ля-ля! Несу бабусі пиріжечки, несу бабусі масла горщичок!"
      sing: true
    - fx: rustle
      on: bush
    - show: vovk
      at: [1300, 770]
    - move: vovk
      to: [960, 770]
      ms: 1200
      wait: true
    - narrator: "Аж раптом із-за куща — сірий вовк! Хотів він одразу дівчинку з'їсти, та не посмів: неподалік у лісі стукали сокирами дроворуби."
    - fx: bang
      at: [1500, 500]
      word: "ТУК-ТУК!"
    - vovk: "Добридень, Червона Шапочко! А куди це ти йдеш?"
    - choice: "Вовк питає, куди вона йде. Що ж робити Червоній Шапочці?"
      options:
        - label: "Розповісти вовкові все"
          icon: "🧺"
          next: rozmova
        - label: "Не розмовляти з незнайомцем"
          icon: "🤫"
          next: movchky

  rozmova:
    - chervona_shapochka: "До бабусі. Несу їй пиріжки й горщичок масла."
    - vovk: "А далеко живе твоя бабуся?"
    - chervona_shapochka: "Далеко! Он за тим млином, у першій хатинці на краю лісу."
    - narrator: "А вовк собі думає: «От і добре! З'їм я і бабусю, і онучку!»"
    - fx: wag
      on: vovk
    - vovk: "Знаєш що, Червона Шапочко? Піду я цією дорогою, а ти — тією. Подивимось, хто швидше до бабусі прийде!"
    - move: vovk
      to: [2100, 770]
      flip: true
      ms: 1300
    - fx: whoosh
      on: vovk
    - fx: dust
      on: vovk
    - narrator: "Сказав — та й чкурнув найкоротшою дорогою. А Червона Шапочка роззирнулася — а довкола квіти цвітуть, метелики пурхають..."
    - choice: "Що ж робитиме Червона Шапочка?"
      options:
        - label: "Збирати квіти й ловити метеликів"
          icon: "🌼"
          next: kvity
        - label: "Не звертати зі стежки й поспішати"
          icon: "🏃"
          next: stezhka

  kvity:
    - scene: glade
    - show: kvity
      at: [380, 770]
    - show: kvity2
      at: [1250, 770]
    - show: metelyky
      at: [860, 520]
      size: 1.7
    - show: chervona_shapochka
      at: [-250, 770]
      flip: true
    - move: chervona_shapochka
      to: [700, 770]
      ms: 2200
      wait: true
    - narrator: "Звернула Червона Шапочка зі стежки. Зірве квіточку — а далі ще краща. Зірве другу — а там ще кращі!"
    - move: chervona_shapochka
      to: [500, 770]
      flip: false
      ms: 700
      wait: true
    - fx: sparkle
      on: kvity
    - hide: kvity
    - hide: chervona_shapochka
    - show: chervona_shapochka
      at: [500, 770]
      look: kvity
    - chervona_shapochka: "Назбираю бабусі букет! Ото вона зрадіє!"
    - move: chervona_shapochka
      to: [1120, 770]
      flip: true
      ms: 1300
      wait: true
    - fx: sparkle
      on: kvity2
    - hide: kvity2
    - narrator: "А тут метелики — пурх, пурх! Кинулася Червона Шапочка їх ловити."
    - move: metelyky
      to: [1250, 360]
      ms: 1000
    - move: chervona_shapochka
      to: [1250, 770]
      hop: true
      ms: 900
      wait: true
    - move: metelyky
      to: [520, 420]
      ms: 1300
    - move: chervona_shapochka
      to: [620, 770]
      flip: false
      hop: true
      ms: 1300
      wait: true
    - chervona_shapochka: "Метелику, метелику, сідай мені на долоньку! Хі-хі!"
    - fx: tumble
      on: chervona_shapochka
    - narrator: "Так і забарилася дівчинка в лісі..."
    - move: metelyky
      to: [-300, 300]
      ms: 1800
    - pause: 500
    - next: mlyn

  mlyn:
    - scene: mlyn
    - show: vovk
      at: [-300, 770]
      flip: true
    - move: vovk
      to: [700, 770]
      ms: 1300
      wait: true
    - vovk: "Хе-хе! Поки дівчинка квіточки збирає, я вже буду в бабусі!"
    - move: vovk
      to: [2100, 770]
      ms: 1500
    - fx: whoosh
      on: vovk
    - fx: dust
      on: vovk
    - narrator: "Мчить вовк найкоротшою дорогою — повз поле, повз млин... Аж курява стоїть!"
    - next: khatynka

  khatynka:
    - scene: uzlissia
    - show: khatynka_babusi
      at: [1050, 770]
    - fx: tuck
      on: khatynka_babusi
      who: [baba]
    - show: vovk
      at: [-300, 770]
      flip: true
    - move: vovk
      to: [860, 770]
      ms: 1800
      wait: true
    - narrator: "Прибіг вовк до бабусиної хатинки — та й постукав у двері."
    - fx: hit
      on: vovk
      who: [khatynka_babusi]
      word: "ТУК-ТУК!"
    - baba: "Хто там?"
    - narrator: "А вовк тоненьким голоском:"
    - vovk: "Це я, ваша онучка, Червона Шапочка. Пиріжків вам принесла і горщичок масла."
    - narrator: "А бабуся була хвора, лежала в ліжку. Тож і гукнула:"
    - baba: "Смикни за мотузочок, дитинко, — двері й відчиняться!"
    - narrator: "Смикнув вовк за мотузочок — двері й відчинилися."
    - fx: bang
      at: [960, 640]
      word: "КЛАЦ!"
    - enter: vovk
      into: khatynka_babusi
    - next: babusia

  babusia:
    - scene: khata-babusi
    - show: lizhko_babusi
      at: [1000, 770]
    - show: baba
      at: [1060, 770]
      look: chepets
    - show: kovdra
      at: [1000, 770]
    - show: vovk
      at: [150, 770]
      flip: true
    - move: vovk
      to: [560, 770]
      ms: 1400
      wait: true
    - baba: "Ой, онученько, це ти? Ой! Та це ж вовк!"
    - fx: shiver
      on: baba
    - narrator: "Кинувся вовк до ліжка..."
    - move: vovk
      to: [690, 770]
      hop: true
      ms: 500
      wait: true
    - fx: chomp
      on: vovk
      who: [baba]
    - narrator: "...та й проковтнув бабусю! Бо три дні вже нічого не їв."
    - fx: munch
      on: vovk
    - narrator: "А тоді вдягнув бабусин чепчик, начепив бабусині окуляри, ліг у ліжко й накрився ковдрою."
    - hide: vovk
    - show: vovk
      at: [690, 770]
      flip: true
      look: babusia
    - fx: sparkle
      on: vovk
    - move: vovk
      to: [1060, 770]
      hop: true
      ms: 700
      wait: true
    - move: vovk
      to: [1060, 770]
      flip: false
      ms: 100
      wait: true
    - vovk: "Хе-хе! А тепер почекаю Червону Шапочку..."
    - next: prykhid

  prykhid:
    - scene: uzlissia
    - show: khatynka_babusi
      at: [1050, 770]
    - fx: tuck
      on: khatynka_babusi
      who: [vovk]
    - show: chervona_shapochka
