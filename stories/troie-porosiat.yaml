# Троє поросят — казка з вибором (за Сергієм Михалковим). Головна лінія — як у відомій казці (жили
# три поросята-брати, Ніф-Ніф, Нуф-Нуф і Наф-Наф, усе літо гралися; настала осінь — Наф-Наф кличе
# будувати хатки на зиму, брати відмахуються: «Встигнемо!»; Ніф-Ніф збудував хатку з соломи, Нуф-Нуф —
# з гілочок, швидко й співаючи, а Наф-Наф — міцний дім з цегли й каміння, з дубовими дверима й
# засувом; брати сміються: «Свинарник чи фортеця?» — «Дім поросяти має бути фортецею!»; співають
# «Нам не страшний сірий вовк, сірий вовк, сірий вовк!»; у лісі — вовк; брати тікають по хатках; вовк
# дмухнув — солом'яна хатка розлетілася, Ніф-Ніф утік до Нуф-Нуфа; вовк дмухнув — розлетілась і хатка
# з гілочок, обидва втекли до Наф-Нафа; «Відчиняйте, бо зламаю!» — «Не подумаємо відчиняти!»; вовк
# дмухав-дмухав — дім стоїть, аж знесилився; поліз через димар — а Наф-Наф зняв кришку з казана з
# окропом: вовк ускочив у казан, ошпарився, вилетів назад через димар і втік до лісу назавжди;
# поросята співають); відгалуження — на виборах. Кроки ті самі, що в інших казках.
#
# Вовк — той самий vovk з «Колобка» (look: pirya — обліплений пір'ям, look: kaska — у будівельній
# касці). Хатки — речі (hata_solomiana, hata_khmyzova, hata_tsehlyana, hata_podushkova): двері — їхній
# «рот», туди входять (enter) і звідти вискакують. Нові ефекти: fx blow on: вовк who: [хатка] — вовк
# дмухає, вітер летить на хатку; солом'яна, з гілочок і з подушок розлітаються на соломинки, гілочки
# й пір'я (хто був усередині — вискакує), а кам'яна тільки труситься; fx scald on: вовк — ошпарився в
# казані (пара, підскакує). Новий фон kamianytsia — у кам'яному домі: камін з димарем, казан (kazan)
# стоїть у каміні на [600, 700], спереду (хто в ньому — видно від грудей); look: kryshka — з кришкою.
# Цегляний дім: двері на x − 80, димар на x + 130, верх димаря на y − 490 (вовк лізе туди по даху).
#
# Після зміни текстів: npm run voice:all (Леся + ElevenLabs).

title: Троє поросят
cover: troie_porosiat
about: "Жили-були три поросятка — Ніф-Ніф, Нуф-Нуф і Наф-Наф. Настала осінь, і кожен збудував собі хатку: з соломи, з гілочок і з цегли. А в лісі тим часом ходив сірий вовк…"

voices:
  narrator: { name: "", pitch: 1.1, rate: 1 }
  nifnif:   { name: "Ніф-Ніф", pitch: 1.5, rate: 1.1, hello: "Привіт! Я Ніф-Ніф! Моя хатка — із соломи: раз-два — і готово! Ходімо гратися!" }
  nufnuf:   { name: "Нуф-Нуф", pitch: 1.35, rate: 1.05, hello: "Привіт! Я Нуф-Нуф! Нам не страшний сірий вовк! Ну... майже не страшний. Хі-хі!" }
  nafnaf:   { name: "Наф-Наф", pitch: 1.15, rate: 0.98, hello: "Добридень! Я Наф-Наф. Дім поросяти має бути фортецею! Хочеш, і тобі збудую?" }
  vovk:     { name: "Вовк", pitch: 0.68, rate: 0.95 }

endings:
  pisenka:     { title: "Нам не страшний сірий вовк!", icon: "🐷" }
  podushky:    { title: "Пір'яний вовк", icon: "🐔" }
  opudalo:     { title: "Страшне опудало", icon: "🌾" }
  budivelnyk:  { title: "Вовк-будівельник", icon: "🧱" }

start: start

scenes:
  start:
    - scene: luh
    - show: nifnif
      at: [520, 770]
    - show: nafnaf
      at: [800, 770]
    - show: nufnuf
      at: [1080, 770]
    - narrator: "Привіт! Сьогодні — казка про трьох поросят. А ти допомагатимеш їм вибирати, що робити далі!"
    - narrator: "Жили-були на світі три поросятка — три брати. Усі однакового зросту, кругленькі, рожеві, з веселими закрученими хвостиками."
    - narrator: "Навіть імена в них були схожі."
    - fx: tumble
      on: nifnif
    - nifnif: "Я — Ніф-Ніф!"
    - fx: tumble
      on: nufnuf
    - nufnuf: "Я — Нуф-Нуф!"
    - fx: tumble
      on: nafnaf
    - nafnaf: "А я — Наф-Наф!"
    - narrator: "Усе літо поросята перекидалися в зеленій травичці, грілися на сонечку й хлюпалися в калюжах."
    - fx: belly
      on: nifnif
    - fx: belly
      on: nufnuf
    - nifnif: "Хрю-хрю! Літо — найкраща пора!"
    - fx: stand
      on: nifnif
    - fx: stand
      on: nufnuf
    - narrator: "Та ось минуло літо..."
    - move: nifnif
      to: [2000, 770]
      flip: true
      ms: 2200
    - move: nafnaf
      to: [2100, 770]
      flip: true
      ms: 2400
    - move: nufnuf
      to: [2200, 770]
      flip: true
      ms: 2400
      wait: true
    - next: osin

  osin:
    - scene: lis-osin
    - show: nifnif
      at: [500, 770]
    - show: nufnuf
      at: [760, 770]
    - show: nafnaf
      at: [1100, 770]
    - narrator: "Настала осінь. Сонечко гріло вже не так, як улітку, а з дерев летіло жовте й червоне листя."
    - fx: shiver
      on: nafnaf
    - nafnaf: "Брр! Пора й нам подумати про зиму. Я аж тремчу від холоду. Збудуймо собі хатки — щоб зимувати в теплі!"
    - nifnif: "Встигнемо! До зими ще далеко. Ми ще погуляємо!"
    - fx: tumble
      on: nifnif
    - nufnuf: "Ага! Коли треба буде, тоді й збудуємо!"
    - nafnaf: "Ну, як хочете. А я вже зараз почну будувати."
    - move: nafnaf
      to: [2000, 770]
      flip: true
      ms: 2000
      wait: true
    - narrator: "Пішов Наф-Наф будувати, а Ніф-Ніф і Нуф-Нуф лишилися гуляти. Та з кожним днем ставало дедалі холодніше."
    - fx: shiver
      on: nifnif
    - fx: shiver
      on: nufnuf
    - nifnif: "Брр! Ну гаразд, і я збудую хатку. Тільки швиденько — з соломи! Раз-два — і готово!"
    - nufnuf: "А я — з гілочок! Теж раз-два — і гуляти!"
    - move: nifnif
      to: [-300, 770]
      ms: 1800
    - move: nufnuf
      to: [-300, 770]
      ms: 2200
      wait: true
    - next: budova

  budova:
    - scene: lis-osin
    - show: soloma
      at: [480, 770]
    - show: khmyz
      at: [1120, 770]
    - show: nifnif
      at: [1900, 770]
    - show: nufnuf
      at: [2100, 770]
    - move: nifnif
      to: [800, 770]
      ms: 2000
    - move: nufnuf
      to: [1440, 770]
      ms: 1600
      wait: true
    - narrator: "Набрав Ніф-Ніф оберемок соломи..."
    - hide: soloma
    - show: hata_solomiana
      at: [480, 770]
    - fx: build
      on: hata_solomiana
    - narrator: "...і за один день збудував собі хатку з соломи."
    - nifnif: "Ось яка гарна хатка! Тепер можна й погуляти!"
    - fx: tumble
      on: nifnif
    - narrator: "А Нуф-Нуф назбирав сухих гілочок..."
    - hide: khmyz
    - show: hata_khmyzova
      at: [1120, 770]
    - fx: build
      on: hata_khmyzova
    - narrator: "...та й склав собі хатку з гілочок. Співав і пританцьовував — швиденько впорався!"
    - nufnuf: "Тра-ля-ля! Моя хатка з гілочок — найкраща в лісі хатка!"
      sing: true
    - fx: tumble
      on: nufnuf
    - choice: "Ніф-Ніф і Нуф-Нуф уже збудували свої хатки. Що ж вони робитимуть далі?"
      options:
        - label: "Піти подивитися, як будує Наф-Наф"
          icon: "🧱"
          next: fortetsia_budova
        - label: "Збудувати ще й хатку з подушок"
          icon: "🛏️"
          next: podushky

  fortetsia_budova:
    - nifnif: "Ходімо подивимося, що там будує Наф-Наф!"
    - move: nifnif
      to: [2000, 770]
      flip: true
      ms: 2000
    - move: nufnuf
      to: [2100, 770]
      flip: true
      ms: 1400
      wait: true
    - next: nafbudova

  nafbudova:
    - scene: glade
    - show: tsehla
      at: [1460, 770]
    - show: hata_tsehlyana
      at: [1050, 770]
      size: 0.05
    - show: nafnaf
      at: [700, 770]
    - show: nifnif
      at: [-300, 770]
      flip: true
    - show: nufnuf
      at: [-480, 770]
      flip: true
    - move: nifnif
      to: [400, 770]
      ms: 2000
    - move: nufnuf
      to: [200, 770]
      ms: 2000
      wait: true
    - narrator: "Пішли брати подивитися, що там будує Наф-Наф. А Наф-Наф носить цеглу, місить глину, кладе камінь до каменю."
    - fx: bang
      on: nafnaf
      word: "ТУК-ТУК!"
    - fx: dust
      on: nafnaf
    - nafnaf: "Цеглинка до цеглинки, камінчик до камінчика — буде міцний дім!"
    - fx: build
      on: hata_tsehlyana
    - fx: bang
      at: [1050, 560]
      word: "ТУК-ТУК!"
    - narrator: "Ріс дім поволі, зате який міцний! З цегли й каміння, з дубовими дверима й залізним засувом. Ще й з димарем, а в хаті — камін."
    - nifnif: "Хі-хі! Що це ти будуєш, Наф-Нафе? Свинарник чи фортецю?"
    - nafnaf: "Дім поросяти має бути фортецею! Бо в лісі живе сірий вовк."
    - nufnuf: "Вовк? Ха-ха! Нема тут ніякого вовка! Ти просто боягуз!"
    - narrator: "І заспівали Ніф-Ніф і Нуф-Нуф, ще й затанцювали:"
    - nifnif: "Нам не страшний сірий вовк, сірий вовк, сірий вовк!"
      sing: true
    - fx: tumble
      on: nifnif
    - fx: tumble
      on: nufnuf
    - nufnuf: "Нам не страшний сірий вовк, сірий вовк, сірий вовк!"
      sing: true
    - nafnaf: "Співайте-співайте. А я ще віконце доробити мушу."
    - narrator: "Махнули брати хвостиками — та й побігли до лісу гуляти."
    - move: nifnif
      to: [-300, 770]
      flip: false
      ms: 1600
    - move: nufnuf
      to: [-300, 770]
      flip: false
      ms: 1400
      wait: true
    - next: lis

  lis:
    - scene: deep
    - show: bush
      at: [300, 770]
    - show: nifnif
      at: [1900, 770]
    - show: nufnuf
      at: [2100, 770]
    - move: nifnif
      to: [880, 770]
      ms: 2000
    - move: nufnuf
      to: [1150, 770]
      ms: 2000
      wait: true
    - narrator: "Бігають брати лісом, стрибають через пеньки та співають на весь ліс:"
    - nufnuf: "Нам не страшний сірий вовк, сірий вовк, сірий вовк!"
      sing: true
    - fx: tumble
      on: nufnuf
    - fx: rustle
      on: bush
    - show: vovk
      at: [280, 770]
      flip: true
    - narrator: "Аж раптом — зашелестіли кущі... і вийшов із-за них справжній сірий вовк! Очі злі, зуби гострі."
    - move: vovk
      to: [560, 770]
      ms: 1200
      wait: true
    - fx: bang
      on: vovk
      word: "Р-Р-Р!"
    - vovk: "Ага! Поросятка! Ото буде мені смачна вечеря!"
    - fx: shiver
      on: nifnif
    - fx: shiver
      on: nufnuf
    - nifnif: "Ой! Вовк! Справжній!"
    - choice: "Ой, вовк! Що ж робити поросятам?"
      options:
        - label: "Тікати до своїх хаток"
          icon: "🏃"
          next: vtecha
        - label: "Зробити опудало"
          icon: "🌾"
          next: opudalo

  vtecha:
    - nufnuf: "Тікаймо! Кожен до своєї хатки!"
    - move: nifnif
      to: [2100, 770]
      flip: true
      ms: 1300
    - move: nufnuf
      to: [2100, 770]
      flip: true
      ms: 1100
    - fx: whoosh
      on: nifnif
    - fx: whoosh
      on: nufnuf
    - fx: dust
      on: nufnuf
    - vovk: "Стійте! Куди ж ви?"
    - move: vovk
      to: [2200, 770]
      ms: 1800
      wait: true
    - next: soloma

  soloma:
    - scene: lis-osin
    - show: hata_solomiana
      at: [480, 770]
    - show: hata_khmyzova
      at: [1120, 770]
    - show: nifnif
      at: [-250, 770]
      flip: true
    - show: nufnuf
      at: [-450, 770]
      flip: true
    - fx: whoosh
      on: nifnif
    - enter: nifnif
      into: hata_solomiana
    - fx: whoosh
      on: nufnuf
    - enter: nufnuf
      into: hata_khmyzova
    - narrator: "Прибіг Ніф-Ніф до своєї солом'яної хатки й зачинив двері. А Нуф-Нуф — до своєї, з гілочок."
    - show: vovk
      at: [-300, 770]
      flip: true
    - move: vovk
      to: [110, 770]
      ms: 1400
      wait: true
    - vovk: "Поросятко, поросятко, відчини! Я тільки погляну, яка в тебе хатка!"
    - nifnif: "Ні! Не відчиню!"
    - vovk: "Ах так? Ну то я як дмухну — і твоя хатка розлетиться!"
    - narrator: "Набрав вовк повні груди повітря та як дмухне:"
    - vovk: "Ф-ф-ф-у-у-у!"
    - fx: bang
      on: hata_solomiana
      word: "ФУУУ!"
    - fx: blow
      on: vovk
      who: [hata_solomiana]
    - narrator: "Солом'яна хатка вмить розлетілася! Тільки соломинки по лісу закружляли."
    - nifnif: "Ой-ой-ой! Нуф-Нуфе, відчини!"
    - fx: whoosh
      on: nifnif
    - enter: nifnif
      into: hata_khmyzova
    - narrator: "Кинувся Ніф-Ніф до брата, у хатку з гілочок. А вовк — за ним!"
    - move: vovk
      to: [790, 770]
      ms: 1300
      wait: true
    - vovk: "Ну, поросятка, відчиняйте!"
    - nufnuf: "Не відчинимо!"
    - vovk: "Ах так? То я й цю хатку здмухну!"
    - narrator: "Набрав вовк повітря — та як дмухне щосили:"
    - vovk: "Ф-ф-ф-у-у-у!"
    - fx: bang
      on: hata_khmyzova
      word: "ФУУУ!"
    - fx: blow
      on: vovk
      who: [hata_khmyzova]
    - narrator: "Затріщали гілочки — і хатка з гілочок теж розлетілася!"
    - nufnuf: "Тікаймо до Наф-Нафа! У нього дім міцний!"
    - move: nifnif
      to: [2200, 770]
      flip: true
      ms: 1200
    - move: nufnuf
      to: [2200, 770]
      flip: true
      ms: 1100
    - fx: whoosh
      on: nufnuf
    - fx: dust
      on: nufnuf
    - vovk: "Не втечете!"
    - move: vovk
      to: [2300, 770]
      flip: true
      ms: 1700
      wait: true
    - next: fortetsia

  fortetsia:
    - scene: glade
    - show: hata_tsehlyana
      at: [1050, 770]
    - fx: tuck
      on: hata_tsehlyana
      who: [nafnaf]
    - show: nifnif
      at: [-250, 770]
      flip: true
    - show: nufnuf
      at: [-420, 770]
      flip: true
    - move: nifnif
      to: [800, 770]
      ms: 1300
    - fx: whoosh
      on: nifnif
    - move: nufnuf
      to: [620, 770]
      ms: 1300
      wait: true
    - nifnif: "Наф-Нафе! Відчини! Вовк за нами женеться!"
    - narrator: "Відчинив Наф-Наф двері, пустив братів..."
    - enter: nifnif
      into: hata_tsehlyana
    - enter: nufnuf
      into: hata_tsehlyana
    - fx: bang
      at: [970, 640]
      word: "КЛАЦ!"
    - narrator: "...і зачинив двері на міцний засув."
    - show: vovk
      at: [-300, 770]
      flip: true
    - move: vovk
      to: [560, 770]
      ms: 1700
      wait: true
    - narrator: "Аж ось і вовк прибіг."
    - fx: hit
      on: vovk
      who: [hata_tsehlyana]
      word: "ГУП-ГУП!"
    - vovk: "Відчиняйте, бо зламаю!"
    - nafnaf: "Ні! Не подумаємо відчиняти!"
    - narrator: "А поросята сидять у кам'яному домі й співають:"
    - nifnif: "Нам не страшний сірий вовк, сірий вовк, сірий вовк!"
      sing: true
    - vovk: "Ах так?! Ну, начувайтеся! Зараз я цю хату як дмухну!"
    - fx: bang
      on: hata_tsehlyana
      word: "ФУУУ!"
    - fx: blow
      on: vovk
      who: [hata_tsehlyana]
    - narrator: "Дмухнув вовк — а дім стоїть. Дмухнув ще раз — стоїть!"
    - fx: blow
      on: vovk
      who: [hata_tsehlyana]
    - narrator: "Дмухав-дмухав вовк, аж знесилився. А кам'яному домові — хоч би що!"
    - fx: sit
      on: vovk
    - vovk: "Ух... Ух... Не можу більше дмухати..."
    - narrator: "Сидить вовк, відсапується. А тоді глянув на дах — і придумав хитрість."
    - fx: stand
      on: vovk
    - vovk: "Ага! Там димар! Через димар я до них і залізу!"
    - move: vovk
      to: [1340, 770]
      ms: 1300
      wait: true
    - move: vovk
      to: [1290, 485]
      hop: true
      ms: 800
      wait: true
    - move: vovk
      to: [1180, 282]
      hop: true
      ms: 700
      wait: true
    - narrator: "Поліз вовк на дах — та й до самого димаря."
    - fx: whoosh
      on: vovk
    - hide: vovk
    - next: kamin

  kamin:
