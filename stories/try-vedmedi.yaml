# Три ведмеді — казка з вибором (Лев Толстой). Головна лінія — як у відомій казці (дівчинка
# заблукала в лісі й прийшла до хатинки, де нікого не було; жили там три ведмеді: Михайло Іванович,
# Настасія Петрівна й маленький Мишко; три миски юшки — з великої гаряча, з середньої несмачна, з
# маленької з'їла все; три стільці — на маленькому гойднулася й зламала; три ліжка — у маленькому
# заснула; «Хто сьорбав з моєї миски?» — грізно, тихіше й тоненько: «А хто сьорбав з моєї мисочки й
# усе висьорбав?»; те саме зі стільцями й ліжками; «Ось вона! Тримай, тримай!» — дівчинка вистрибнула
# у вікно й утекла); відгалуження — на виборах. Кроки ті самі, що в інших казках. Нові фони:
# svitlytsia (у ведмежій хатинці: піч, віконце, три капелюхи й три кухлі) і spalnia (спальня: три
# портрети). Стіл stil_vedmediv — спереду (стільниця на y = 620): хто за ним, того видно від пояса;
# миски стоять на ньому (y 628). Стільці великий і середній — за столом, маленький — збоку; fx break
# на маленькому стільчику — і лишаються уламки (stilets_lamanyi). Ліжка: велике (матрац на y 570),
# середнє (високе, на y 440), маленьке (на y 670); хто лягає — lie на висоті матраца. Порожня
# Мишкова мисочка — show miska_mala look: porozhnia. Віконце vikno в спальні — над маленьким ліжком.
#
# Після зміни текстів: npm run voice:all (Леся + ElevenLabs).

title: Три ведмеді
cover: try_vedmedi
about: "Пішла дівчинка Маша до лісу та й заблукала. А в лісі — хатинка, а в хатинці — нікого. Тільки три миски, три стільці й три ліжка… Чиї ж вони?"

