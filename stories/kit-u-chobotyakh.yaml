# Кіт у чоботях — казка з вибором (Шарль Перро). Головна лінія — як у відомій казці (помер
# мірошник, наймолодшому синові дістався кіт; «справ мені чоботи й дай торбу»; кролик у торбі й
# куріпки королеві «від маркіза Карабаса»; «Рятуйте! Маркіз Карабас тоне!» — одяг під каменем,
# королівське вбрання; «Кажіть, що це луки й поля маркіза Карабаса!»; замок людожера: «Кажуть, ти
# вмієш перетворюватися на лева?» — кіт стрибає під стелю; «А на мишку?» — кіт стрибнув і з'їв
# мишку; маркіз одружується з принцесою, кіт став вельможею й ловив мишей лише для розваги);
# відгалуження — на виборах. Кроки ті самі, що в інших казках. Нові: фони mlyn (вітряк на пагорбі),
# palats (тронна зала), richka (берег: дорога ліворуч, річка праворуч), zamok (замок людожера), zal
# (зала замку, сволок на y = 420 — туди стрибає кіт); fx poof on: хто who: [ким стає] — чари: клуб
# диму, і на тому місці вже інший; fx bow — уклін. Карета (kareta) — відкрита: хто в ній їде, стоїть
# за нею на 40 вище (y 730), місця — на 20, 130 і 240 позаду від її середини (дивиться праворуч:
# x − 20, x − 130, x − 240); щоб карета була попереду, її показують після пасажирів. Вода voda — спереду:
# хто в ній, того видно від пояса. Кіт спершу босий (look: bosyi), потім у чоботях.
#
# Після зміни текстів: npm run voice:all (Леся + ElevenLabs).

title: Кіт у чоботях
cover: kit_chobotar
about: "Дістався наймолодшому синові мірошника у спадок тільки кіт. Та не простий кіт — а хитрий-прехитрий! Попросив він чоботи й торбу — і як закрутилося!"

voices:
  narrator:     { name: "", pitch: 1.1, rate: 1 }
  kit_chobotar: { name: "Кіт у чоботях", pitch: 1.2, rate: 1.05, hello: "Мур-мяу! Я Кіт у чоботях! Бачиш, які в мене чоботи? Найкращі в королівстві!" }
  syn:          { name: "Син мірошника", pitch: 1.0, rate: 1.0 }
  markiz:       { name: "Маркіз Карабас", pitch: 1.0, rate: 1.0, hello: "Добридень! Я маркіз Карабас. Тільки цс-с — це мене котик так назвав!" }
  korol:        { name: "Король", pitch: 0.75, rate: 0.9, hello: "Я король! Хочеш покататися в моїй золотій кареті?" }
  pryntsesa:    { name: "Принцеса", pitch: 1.35, rate: 1.0, hello: "Привіт! Я принцеса. Ходімо гуляти понад річкою?" }
  lyudozher:    { name: "Людожер", pitch: 0.6, rate: 0.85, hello: "Ого-го! Я людожер! Та не бійся — я вже пообідав!" }
  starshi:      { name: "Старші брати", pitch: 0.85, rate: 1.0 }
  kosari:       { name: "Косарі", pitch: 0.8, rate: 1.0 }
  zhentsi:      { name: "Женці", pitch: 1.25, rate: 1.0 }
  lev:          { name: "Лев", pitch: 0.5, rate: 0.85 }
  myshenia:     { name: "Мишка", pitch: 1.75, rate: 1.15 }
  kulka:        { name: "Кулька", pitch: 1.45, rate: 1.1 }

endings:
  canon:  { title: "Маркіз Карабас", icon: "👑" }
  ryba:   { title: "Юшка від Кота", icon: "🐟" }
  svyato: { title: "Свято в людожера", icon: "🎉" }
  kulka:  { title: "Людожер-кулька", icon: "🎈" }

start: start

scenes:
  start:
