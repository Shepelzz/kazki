    - show: osel
      at: [380, 770]
    - show: starshi
      at: [620, 770]
    - show: syn
      at: [980, 770]
    - show: kit_chobotar
      at: [1180, 770]
      look: bosyi
    - narrator: "Привіт! Сьогодні — казка про Кота в чоботях. А ти допомагатимеш котикові вибирати, що робити далі!"
    - narrator: "Жив собі старий мірошник, і було в нього троє синів. Помер мірошник — і залишив синам у спадок млин, осла та кота."
    - starshi: "Млин — старшому братові, осел — середньому! А тобі, наймолодшому, — кіт!"
    - fx: bang
      on: osel
      word: "ІА!"
    - narrator: "Забрали старші брати млин та осла — та й пішли собі працювати."
    - move: osel
      to: [-300, 770]
      ms: 2600
    - move: starshi
      to: [-200, 770]
      ms: 2600
      wait: true
    - narrator: "А наймолодшому дістався тільки кіт."
    - fx: sit
      on: syn
    - syn: "Ех... Брати разом млин крутитимуть, борошно мелютимуть. А що ж мені робити з котом?"
    - move: kit_chobotar
      to: [1120, 770]
      ms: 600
      wait: true
    - kit_chobotar: "Не журися, хазяїне! Дай мені лише одну річ — і побачиш: не такий я вже й поганий спадок!"
    - fx: wake
      on: syn
    - syn: "Ти... ти вмієш говорити?!"
    - kit_chobotar: "Ще й як! Мур-мяу!"
    - choice: "Що ж попросить кіт у хазяїна?"
      options:
