    - narrator: "Привіт! Сьогодні — казка про Дюймовочку. А ти допомагатимеш маленькій Дюймовочці вибирати, що робити далі!"
    - narrator: "Жила собі одна жінка. Дуже-дуже хотілося їй мати маленьку дитинку, та де ж її взяти?"
    - zhinka: "Ох... Якби ж у мене була донечка — хоч найменша-найменша!"
    - fx: tears
      on: zhinka
    - narrator: "І пішла вона до старої чарівниці."
    - move: zhinka
      to: [-300, 770]
      ms: 2200
      wait: true
