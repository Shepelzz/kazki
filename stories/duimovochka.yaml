# Дюймовочка — казка з вибором (Ганс Крістіан Андерсен). Головна лінія — як у відомій казці (жінка
# дуже хотіла дитинку, стара чарівниця дала їй ячмінне зернятко; з нього виріс тюльпан, жінка
# поцілувала пелюстки — квітка розкрилася, а в ній крихітна дівчинка, завбільшки з дюйм, —
# Дюймовочка; спала в горіховій шкаралупці, плавала на пелюстці в тарілці з водою й співала. Уночі
# ропуха вкрала її для свого сина («Коакс, коакс, брекекекекс!») і посадила на лист латаття посеред
# річки; рибки перегризли стебло, листок поплив, білий метелик тягнув його на її пояску. Травневий
# жук схопив її, та інші жуки сказали: «Вона ж має лише дві ніжки! А вусиків нема! Яка негарна!» —
# і він посадив її на ромашку. Літо й осінь сама в лісі, взимку — до польової миші («Ах ти,
# бідолашна дитино!»); та сватала її за сусіда — багатого крота в оксамитовій шубці, що не любить
# ні сонця, ні квітів. У підземному ході лежала замерзла ластівка — Дюймовочка вкрила її, відігріла
# й виходила; навесні ластівка відлетіла. Перед весіллям із кротом Дюймовочка вийшла попрощатися
# з сонечком — прилетіла ластівка, і вони полетіли в теплі краї; там у білій квітці — крихітний
# принц ельфів у коронці: він подарував їй крильця, назвав Майєю, і вона стала королевою ельфів);
# відгалуження — на виборах. Кроки ті самі, що в інших казках.
#
# Дюймовочку показуємо маленькою (size 0.6; у хаті жінки, у тюльпані на столі, — ще менше), а
# квіти, шкаралупка, латаття, ропуха й мишка навколо неї — велетенські. Ропуха — це жабка з
# «Рукавички» (zhabka, size 2.4), польова миша — мишка (myshka, size 2.1). Нові фони: stil-zblyzka /
# stil-nich (стіл жінки зблизька, вдень і вночі, з розбитою шибкою), zymove-pole (зимове поле зі
# стернею), norka (мишача нірка всередині), khid (підземний хід крота), teplyi-krai (теплі краї).
# Хто лежить у шкаралупці чи стоїть на лататті, на пелюстці, на ластівці — carry by тієї речі.
#
# Після зміни текстів: npm run voice:all (Леся + ElevenLabs).

title: Дюймовочка
cover: duimovochka_cover
about: "Виросла з ячмінного зернятка квітка, а в ній — крихітна дівчинка, завбільшки з дюйм. Скільки ж пригод чекає на таку малесеньку!"

