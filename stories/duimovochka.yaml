    - fx: hearts
      on: duimovochka
    - move: duimovochka
      to: [1110, 360]
      hop: true
      ms: 1200
      wait: true
    - show: elf
      at: [1200, 360]
      size: 0.6
    - fx: sparkle
      on: elf
    - narrator: "Аж глядь — у квітці сидить маленький чоловічок, білий і прозорий, наче скляний. На голові в нього золота коронка, а за плечима — прозорі крильця. Сам він — не більший за Дюймовочку. Це був ельф, а в кожній квітці жили такі ельфи. А він був їхнім королем."
    - duimovochka: "Ой, який він гарний!"
    - elf: "Яка ти гарна! Як тебе звати?"
    - duimovochka: "Дюймовочка."
    - elf: "Чи хочеш ти стати моєю дружиною, королевою всіх квітів?"
    - duimovochka: "Хочу!"
    - fx: hearts
      on: elf
    - narrator: "Це ж не гидкий синок ропухи і не кріт в оксамитовій шубці! Тож вона погодилася. І з кожної квітки вилетіли ельфи — і кожен приніс їй подарунок."
    - narrator: "А найкращим подарунком була пара прозорих крилець. Їх прикріпили Дюймовочці до спини — і тепер вона теж могла літати з квітки на квітку!"
    - hide: duimovochka
    - show: duimovochka
      at: [1110, 360]
      size: 0.6
      look: koroleva
    - fx: sparkle
      on: duimovochka
    - elf: "Тебе більше не зватимуть Дюймовочкою. Ти будеш у нас Майя — королева ельфів!"
    - lastivka: "Кві-віть! Кві-віть! Будь щаслива, Майє!"
      sing: true
    - fx: tumble
      on: elf
    - fx: tumble
      on: duimovochka
    - narrator: "Отак крихітна дівчинка з ячмінного зернятка стала королевою ельфів. А ластівка співала їм на весіллі найкращої пісні, яку тільки знала!"
    - ending: koroleva

  # ---------- відгалуження: пісенька на лататті ----------

  pisnia:
    - fx: stand
      on: duimovochka
    - duimovochka: "Не буду я плакати! Краще заспіваю — пісенька завжди допомагає."
    - duimovochka: "Ой, листочку зелененький, ой, ставочку синенький, хвилі, хвилі, гойдайте — мене не віддавайте!"
      sing: true
    - show: rybky
      at: [1220, 806]
    - narrator: "Полинула пісенька над річкою. І рибки виринули з води послухати, і бабки позлітались, і навіть стара ропуха з сином припливли назад."
    - show: zhabka
      at: [1900, 800]
      size: 2.2
    - show: synok
      at: [2100, 815]
    - move: zhabka
      to: [1450, 800]
      ms: 1800
    - move: synok
      to: [1650, 815]
      ms: 2000
      wait: true
    - rybky: "Ой, як гарно! Ще, ще!"
    - synok: "Коакс... Коакс... Ква-а-а! Я теж хочу співати!"
    - fx: shake
      on: synok
    - narrator: "Заквакав синок на всю річку — та так голосно й не в лад, що аж рибки пірнули."
    - duimovochka: "Не так, не так! Тихенько, лагідно: ква-ква-ква, ква-ква-ква. Повторюй за мною!"
      sing: true
    - synok: "Ква-ква-ква... ква-ква-ква!"
      sing: true
    - fx: hearts
      on: zhabka
    - zhabka: "Ква-а! Мій синок заспівав! Уперше в житті — та й гарно! Ото дивина!"
    - zhabka: "Знаєш що, крихітко? Не будемо його женити. Нехай краще співає з тобою на весь ставок! А ти живи на своєму листку — ми тобі хатинку з білого латаття зробимо."
    - duimovochka: "Дякую! А ти, синку, приходь щовечора — будемо співати разом!"
    - fx: tumble
      on: synok
    - narrator: "Відтоді щовечора на річці співочий концерт: Дюймовочка співає, синок ропухи квакає в лад, рибки хлюпають хвостиками, а метелики танцюють. І ніхто вже не каже, що синок ропухи гидкий: бо хто гарно співає, той і сам гарнішає!"
    - fx: hearts
      on: duimovochka
    - ending: spivanka

  # ---------- відгалуження: зима в ведмежому барлозі ----------

  barlih:
    - duimovochka: "Піду до ведмежого барлогу. Там тепло — пара йде! Ведмеді взимку сплять, мене й не помітять."
    - move: duimovochka
      to: [1900, 770]
      ms: 2800
      wait: true
    - next: berloha

  berloha:
    - scene: berloga
    - show: vedmid
      at: [1000, 770]
      size: 1.2
      eyes: closed
    - fx: lie
      on: vedmid
    - fx: sleep
      on: vedmid
    - show: duimovochka
      at: [-200, 770]
      size: 0.6
      flip: true
    - move: duimovochka
      to: [640, 770]
      ms: 2400
      wait: true
    - narrator: "Прокралася Дюймовочка в ведмежу хатку. А там на лежанці спить великий кошлатий ведмідь і хропе так, що аж стіни тремтять."
    - fx: shake
      on: vedmid
    - duimovochka: "Добрий ведмедику... Можна я в тебе перезимую? Я зовсім маленька, місця мало займу!"
    - vedmid: "Мгм... Хр-р-р... Зимуй... Хр-р-р-р..."
    - narrator: "Пробурмотів ведмідь крізь сон. Пригорнулася Дюймовочка до його теплого кошлатого боку, як до пухової перини, — та й заснула."
    - move: duimovochka
      to: [860, 770]
      ms: 1000
      wait: true
    - fx: lie
      on: duimovochka
    - fx: sleep
      on: duimovochka
    - pause: 1200
    - narrator: "Спали вони так цілу зиму. Аж ось пригріло весняне сонечко..."
    - fx: wake
      on: vedmid
    - vedmid: "Ох і виспався! А-а-ах! А це ще що за крихітка в мене під боком?"
    - fx: wake
      on: duimovochka
    - duimovochka: "Добридень, ведмедику! Я Дюймовочка. Ти ж сам мені дозволив тут перезимувати — уві сні!"
    - vedmid: "Ха-ха! Ото гостя! Ну, коли я дозволив, то так тому й бути. А тепер — гайда разом на весну дивитися!"
    - move: vedmid
      to: [1900, 770]
      flip: true
      ms: 2400
    - move: duimovochka
      to: [1900, 770]
      hop: true
      ms: 2600
      wait: true
    - next: vesna

  vesna:
    - scene: polyana
    - show: vedmid
      at: [-300, 770]
      size: 1.2
      flip: true
    - show: duimovochka
      at: [-80, 770]
      size: 0.6
      flip: true
    - move: vedmid
      to: [600, 770]
      ms: 2400
    - move: duimovochka
      to: [900, 770]
      hop: true
      ms: 2400
      wait: true
    - narrator: "Вийшли вони на весняну галявину. Квіти цвітуть, пташки співають, сонечко гріє!"
    - duimovochka: "Яка краса! Ведмедику, а ти знаєш, у якій квітці найсмачніший нектар?"
    - vedmid: "Нектар — то дрібниці. А от мед! Тримай-но, крихітко, медову краплинку — тобі якраз на цілий обід!"
    - fx: munch
      on: duimovochka
    - fx: munch
      on: vedmid
    - fx: hearts
      on: duimovochka
    - narrator: "Так і стали вони найкращими друзями: найбільший у лісі ведмідь і найменша у світі дівчинка. Улітку Дюймовочка співає ведмедеві пісеньки, а взимку спить у його теплій шерсті — і жодна зима їй тепер не страшна!"
    - ending: barlih

  # ---------- відгалуження: полетіти з ластівкою навесні ----------

  lechu:
    - duimovochka: "Полечу! Тільки, ластівко... чи не можна мені спершу додому — до мами? Вона ж, мабуть, плаче за мною!"
    - lastivka: "Звісно, можна! Я знаю кожну хатку в окрузі. Сідай мені на спинку!"
    - move: duimovochka
      to: [1050, 770]
      ms: 500
      wait: true
    - carry: duimovochka
      by: lastivka
    - fx: sit
      on: duimovochka
    - move: lastivka
      to: [1950, -150]
      flip: true
      ms: 1800
    - fx: whoosh
      on: lastivka
    - narrator: "Шугнула ластівка крізь дірку в стелі — та й полетіла над полями, над лісами, просто до тієї хати, де жила жінка."
    - pause: 800
    - next: dodomu

  dodomu:
    - scene: hata
    - show: zhinka
      at: [700, 770]
    - narrator: "А жінка весь час сумувала за своєю донечкою: як зникла вона тієї ночі разом із шкаралупкою, то й сльози в неї не висихали."
    - fx: tears
      on: zhinka
    - zhinka: "Де ж ти, моя крихітко? Де ж ти, Дюймовочко?"
    - show: lastivka
      at: [1900, 160]
    - show: duimovochka
      at: [1930, -10]
      size: 0.6
    - carry: duimovochka
      by: lastivka
    - fx: sit
      on: duimovochka
    - lastivka: "Кві-віть! Кві-віть!"
    - move: lastivka
      to: [1050, 770]
      ms: 2200
      wait: true
    - duimovochka: "Мамо! Мамусю! Це я, Дюймовочка!"
    - put: duimovochka
      to: [880, 770]
      ms: 700
    - fx: stand
      on: duimovochka
    - zhinka: "Донечко моя! Повернулася!"
    - fx: hearts
      on: zhinka
    - fx: hearts
      on: duimovochka
    - duimovochka: "Мамо, це ластівка — вона принесла мене додому. А я її взимку відігріла!"
    - zhinka: "Спасибі тобі, ластівко! Живи в нас під стріхою — я тобі завжди буду рада."
    - lastivka: "Кві-віть! Залюбки! Звію гніздечко — і щовесни прилітатиму!"
      sing: true
    - narrator: "Звила ластівка гніздо під стріхою. А Дюймовочка знову спала в горіховій шкаралупці, плавала на пелюстці в тарілці — і співала. А польовій мишці ластівка віднесла вісточку, щоб не сумувала. Бо вдома, з мамою, — найкраще!"
    - ending: mama
