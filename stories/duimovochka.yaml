  duimovochka:  { name: "Дюймовочка", pitch: 1.5, rate: 1.05, hello: "Привіт! Я Дюймовочка — завбільшки з дюйм! А виросла я з ячмінного зернятка, у тюльпані!" }
  zhinka:       { name: "Жінка", pitch: 1.05, rate: 0.95 }
