  synok:        { name: "Син ропухи", pitch: 0.7, rate: 0.95 }
  rybky:        { name: "Рибки", pitch: 1.6, rate: 1.1 }
  zhuk:         { name: "Травневий жук", pitch: 0.85, rate: 1, hello: "Ж-ж-ж! Я травневий жук! У мене шість ніжок і вусики-віяла! А в тебе скільки ніжок?" }
  zhuky:        { name: "Жуки", pitch: 1.2, rate: 1.1 }
  myshka:       { name: "Польова миша", pitch: 1.35, rate: 0.95 }
  krit:         { name: "Кріт", pitch: 0.65, rate: 0.85, hello: "Добридень. Я кріт в оксамитовій шубці. Сонце? Квіти? Фе! Хоча... з тобою, мабуть, і на сонечко вийду." }
  lastivka:     { name: "Ластівка", pitch: 1.25, rate: 1.05, hello: "Кві-віть! Я ластівка! Сідай мені на спинку — полетимо в теплі краї!" }
  elf:          { name: "Принц ельфів", pitch: 1.3, rate: 1, hello: "Вітаю! Я принц ельфів — найменший принц на світі! Хочеш, подарую тобі крильця?" }
  vedmid:       { name: "Ведмідь", pitch: 0.55, rate: 0.85 }

endings:
  koroleva: { title: "Королева ельфів", icon: "👑" }
  spivanka: { title: "Співочий ставок", icon: "🎵" }
  barlih:   { title: "Зима в барлозі", icon: "🐻" }
  mama:     { title: "Додому до мами", icon: "🏠" }

