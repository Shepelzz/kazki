# Коза-дереза — казка з вибором.
# Кроки ті самі, що в kolobok.yaml і rukavychka.yaml (див. їхні шапки), плюс ефекти:
#   - fx: munch      коза нахиляє голову й жує травичку (on: koza)
#   - fx: tears      сльози (on: zayets)
#   - fx: pinch      хтось щипнув у хатці: зірочки з дверей, хатка підстрибує (on: khatynka)
#
# Після зміни текстів: npm run voice:all (Леся + ElevenLabs).

title: Коза-дереза
cover: koza

voices:
  narrator:  { name: "", pitch: 1.1, rate: 1 }
  did:       { name: "Дід", pitch: 0.72, rate: 0.9 }
  baba:      { name: "Баба", pitch: 1.0, rate: 0.95 }
  koza:      { name: "Коза", pitch: 1.3, rate: 1.05 }
  zayets:    { name: "Зайчик", pitch: 1.4, rate: 1.15 }
  vovk:      { name: "Вовк", pitch: 0.68, rate: 0.95 }
  yizhachok: { name: "Їжачок", pitch: 1.5, rate: 1.05 }
  rak:       { name: "Рак", pitch: 0.9, rate: 0.95 }

endings:
  sorry:    { title: "Чесна козочка", icon: "🙏" }
  hedgehog: { title: "Колючий їжачок", icon: "🦔" }
  crab:     { title: "Рак-неборак", icon: "🦀" }
  friends:  { title: "Подружилися", icon: "🤝" }

start: start

scenes:
  start:
    - scene: hata
    - show: did
      at: [1060, 770]
    - show: baba
      at: [1270, 770]
    - show: koza
      at: [800, 770]
      flip: true
    - narrator: "Привіт! Зараз буде казка про одну дуже хитру козу. А ти допомагатимеш вибирати, що буде далі."
    - narrator: "Жили собі дід та баба, і була в них коза — біла, рогата, бородата, з дзвіночком на шиї."
    - koza: "Ме-е-е! Я їсти хочу!"
    - did: "Бабо, а пожени-но козу на пашу. Хай наїсться травички."
    - baba: "Добре, діду. Ходімо, кізонько!"
    - next: pasture

  pasture:
    - scene: luh
    - show: baba
      at: [560, 770]
    - show: koza
      at: [1000, 770]
    - narrator: "Цілісінький день пасла баба козу на лузі біля річки. Травичка соковита, конюшинка солодка..."
    - fx: munch
      on: koza
    - koza: "Ням-ням! Ох і смачна ж травичка!"
    - move: koza
      to: [800, 770]
      ms: 1400
      wait: true
    - fx: munch
      on: koza
    - narrator: "Наїлася коза, напилася водички з річки — аж боки роздулися. Пора й додому."
    - move: baba
      to: [-250, 770]
      ms: 3000
    - move: koza
      to: [-200, 770]
      ms: 3200
      wait: true
    - next: evening

  evening:
    - scene: hata-evening
    - show: did
      at: [1060, 770]
    - show: baba
      at: [1270, 770]
    - show: koza
      at: [800, 770]
      flip: true
    - did: "Кізонько моя, чи ти пила, чи ти їла?"
    - koza: "Ой, не пила я, не їла! Тільки бігла через місточок та вхопила кленовий листочок. Тільки бігла через гребельку та вхопила водиці крапельку. Оце й уся моя їда!"
    - baba: "Та що ти кажеш! Вона ж цілий день паслася — аж боки роздулися!"
    - choice: "Кому повірить дід?"
      options:
        - label: "Повірити козі"
          icon: "🐐"
          next: believe_goat
        - label: "Повірити бабі"
          icon: "👵"
          next: believe_baba

  believe_goat:
    - did: "Ох, бабо, бабо! Голодом козу заморила!"
    - baba: "Ах так? Ну то паси її завтра сам!"
    - narrator: "Насупилася баба й пішла до хати. А дід вирішив: завтра сам попасе козу. Подивимося, що з того вийде!"
    - move: baba
      to: [330, 770]
      ms: 2400
      wait: true
    - hide: baba
    - next: did_pasture

  believe_baba:
    - did: "Гм... Хтось тут каже неправду. Ану ж я завтра сам попасу козу — та й подивлюся!"
    - baba: "От і правильно, діду. Сам побачиш!"
    - next: did_pasture

  did_pasture:
    - scene: luh
    - show: koza
      at: [1000, 770]
    - show: did
      at: [600, 770]
    - narrator: "Наступного дня пішов дід із козою на луг. А сам — хитрий! — сховався за кущем та й дивиться."
    - show: bush
      at: [520, 790]
    - move: did
      to: [520, 770]
      ms: 1000
      wait: true
    - fx: munch
      on: koza
    - koza: "Ням-ням-ням! Ой, як смачно! Травичка, конюшинка, ще й водички поп'ю!"
    - fx: munch
      on: koza
    - did: "Ти ба, як наминає! Цілий день жує — і не спиниться."
    - narrator: "Їла коза, їла, аж поки зорі на небі не засвітилися."
    - next: evening2

  evening2:
    - scene: hata-evening
    - show: did
      at: [1060, 770]
    - show: koza
      at: [800, 770]
      flip: true
    - did: "Кізонько моя, чи ти пила, чи ти їла?"
    - koza: "Ой, не пила я, не їла! Тільки бігла через місточок та вхопила кленовий листочок..."
    - did: "Ах ти ж брехушко! Я ж сам бачив, як ти цілий день травичку наминала!"
    - choice: "Що зробить коза?"
      options:
        - label: "Утекти в ліс"
          icon: "🏃"
          next: runaway
        - label: "Попросити вибачення"
          icon: "🙏"
          next: sorry

  sorry:
    - narrator: "Опустила коза голову, аж дзвіночок тихенько дзенькнув."
    - koza: "Пробач мені, дідусю... Я наїлася, а сказала, що голодна. Мені соромно. Я більше не буду брехати!"
    - did: "Ну гаразд, кізонько. Добре, що зізналася. Правду казати — завжди сміливо!"
    - show: baba
      at: [330, 770]
    - move: baba
      to: [1270, 770]
      ms: 2400
      wait: true
    - baba: "От і мир у хаті! А за правду — ось тобі скоринка хліба."
    - fx: hearts
      on: koza
    - narrator: "З того дня коза більше ніколи не брехала. А дід і баба пасли її по черзі, і всім було весело."
    - ending: sorry

  runaway:
    - koza: "Ме-е-е! Утечу я від вас!"
    - move: koza
      to: [1900, 770]
      flip: true
      ms: 1800
    - did: "Стій, козо! Куди ти?"
    - narrator: "Та де там! Тільки дзвіночок задзеленчав — і нема кози. Побігла вона аж у ліс."
    - next: forest

  forest:
    - scene: lis-osin
    - show: khatynka
      at: [760, 770]
    - show: zayets
      at: [1000, 770]
    - narrator: "А в лісі стояла маленька хатка зайчика. Саме тоді зайчик пішов на город по капусту."
    - move: zayets
      to: [-300, 770]
      hop: true
      ms: 2200
    - show: koza
      at: [1900, 770]
    - move: koza
      to: [1000, 770]
      ms: 2200
      wait: true
    - koza: "О, хатка! І нікого нема. Тут я й житиму!"
    - enter: koza
      into: khatynka
    - narrator: "Залізла коза в зайчикову хатку та й зачинилася. Аж тут повертається зайчик із капустиною."
    - show: zayets
      at: [-250, 770]
      flip: true
    - show: kapusta
      at: [-250, 704]
      size: 0.8
    - carry: kapusta
      by: zayets
    - move: zayets
      to: [1050, 770]
      flip: true
      hop: true
      ms: 2400
      wait: true
    - put: kapusta
      to: [1180, 770]
      ms: 500
    - zayets: "Хто-хто в моїй хатці?"
    - koza: "Я коза-дереза, за три копи куплена, рогата-бородата! Тупу-тупу ногами, сколю тебе рогами, ніжками затопчу, хвостиком замету — тікай, бо як дам!"
    - narrator: "Злякався зайчик, сів на пеньочок та й заплакав."
    - fx: tears
      on: zayets
    - zayets: "Ой, що ж мені робити? Хатка моя, а там коза-дереза сидить..."
    - choice: "Кого покличе зайчик на допомогу?"
      options:
        - label: "Сірого вовка"
          icon: "🐺"
          next: wolf
        - label: "Їжачка"
          icon: "🦔"
          next: hedgehog

  wolf:
    - narrator: "Біжить повз сірий вовк."
    - show: vovk
      at: [1900, 770]
    - move: vovk
      to: [1240, 770]
      ms: 2000
      wait: true
    - vovk: "Чого ти, зайчику, плачеш?"
    - zayets: "Та як же не плакати? Залізла в мою хатку коза-дереза й не пускає!"
    - vovk: "Не плач! Я її зараз вижену. Ану, хто там у хатці?"
    - move: vovk
      to: [960, 770]
      ms: 1100
      wait: true
    - koza: "Я коза-дереза, за три копи куплена, рогата-бородата! Тупу-тупу ногами, сколю тебе рогами, ніжками затопчу, хвостиком замету — тікай, бо як дам!"
    - vovk: "Ой! Рогата! Я рогатих боюся!"
    - move: vovk
      to: [1950, 770]
      flip: true
      ms: 1400
      wait: true
    - narrator: "Тільки хвіст замигтів — утік вовк. А зайчик заплакав ще дужче."
    - fx: tears
      on: zayets
    - choice: "Хто ж допоможе зайчикові?"
      options:
        - label: "Покликати рака-неборака"
          icon: "🦀"
          next: crab
        - label: "Поговорити з козою по-доброму"
          icon: "🥕"
          next: friends

  hedgehog:
    - narrator: "Аж тут — шурх-шурх по листю — котиться колючий клубочок. Це їжачок!"
    - show: yizhachok
      at: [1900, 770]
    - move: yizhachok
      to: [1220, 770]
      ms: 2000
      wait: true
    - yizhachok: "Чого плачеш, зайчику?"
    - zayets: "Залізла в мою хатку коза-дереза, і ніхто її вигнати не може!"
    - yizhachok: "Я їжачок — колючий бочок! Зараз я її провчу!"
    - move: yizhachok
      to: [920, 770]
      ms: 1300
      wait: true
    - koza: "Я коза-дереза, за три копи куплена, рогата-бородата! Тупу-тупу ногами, сколю тебе рогами..."
    - yizhachok: "А в мене голки гострі! Як наставлю голки — розбіжаться й вовки!"
    - enter: yizhachok
      into: khatynka
    - fx: pinch
      on: khatynka
    - koza: "Ой-ой-ой! Колеться! Ой, голки! Тікаю!"
    - fx: scatter
      on: khatynka
      who: [koza]
    - narrator: "Вискочила коза з хатки — і тільки дзвіночок задзеленчав десь далеко-далеко."
    - fx: popout
      on: khatynka
      who: [yizhachok]
    - zayets: "Дякую тобі, їжачку! Ти найхоробріший!"
    - fx: hearts
      on: yizhachok
    - narrator: "І зажили вони з того дня як найкращі друзі. А коза-дереза повернулася до діда, і більше чужих хаток не займала."
    - ending: hedgehog

  crab:
    - narrator: "Аж тут вилазить із річки рак-неборак — клешнями клац-клац!"
    - show: rak
      at: [1900, 770]
    - move: rak
      to: [1240, 770]
      ms: 2400
      wait: true
    - rak: "Чого плачеш, зайчику?"
    - zayets: "Залізла в мою хатку коза-дереза! Ні я, ні вовк не можемо її вигнати."
    - rak: "Я рак-неборак! Як ущипну — буде знак!"
    - enter: rak
      into: khatynka
    - fx: pinch
      on: khatynka
    - koza: "Ой-ой-ой! Хто це щипається? Ой, боляче! Тікаю!"
    - fx: scatter
      on: khatynka
      who: [koza]
    - narrator: "Як вискочить коза з хатки, як дремене лісом — тільки її й бачили!"
    - fx: popout
      on: khatynka
      who: [rak]
    - rak: "Ось і все! Живи, зайчику, у своїй хатці."
    - zayets: "Дякую, раче-небораче! Маленький, а сміливий!"
    - fx: hearts
      on: rak
    - narrator: "Відтоді зайчик і рак-неборак стали найкращими друзями. А коза... кажуть, і досі тремтить, як почує про раків!"
    - ending: crab

  friends:
    - zayets: "А може... не треба нікого кликати? Спробую я по-доброму."
    - move: zayets
      to: [1180, 770]
      ms: 600
      wait: true
    - carry: kapusta
      by: zayets
    - move: zayets
      to: [960, 770]
      hop: true
      ms: 1200
      wait: true
    - zayets: "Козо-дерезо! Виходь, я тебе капусткою пригощу. Тільки скажи по правді — навіщо ти мою хатку зайняла?"
    - fx: popout
      on: khatynka
      who: [koza]
    - koza: "Ой... Мені соромно, зайчику. Я діда обдурила, втекла з дому, а тепер ще й тебе з хатки вигнала. Пробач мені!"
    - zayets: "Пробачаю! Друзі ж мають миритися."
    - put: kapusta
      to: [1060, 770]
      ms: 500
    - fx: munch
      on: koza
    - narrator: "З'їли вони разом капустину — хрум-хрум! А потім зайчик провів козу аж до дідової хати."
    - scene: hata-evening
    - show: did
      at: [1060, 770]
    - show: baba
      at: [1270, 770]
    - show: koza
      at: [-200, 770]
      flip: true
    - show: zayets
      at: [-380, 770]
      flip: true
    - move: koza
      to: [800, 770]
      flip: true
      ms: 2600
    - move: zayets
      to: [600, 770]
      flip: true
      hop: true
      ms: 2600
      wait: true
    - koza: "Діду, бабо, пробачте мені! Я більше ніколи не буду брехати."
    - did: "Ох ти ж, моя кізонько! Ну, раз зізналася — то й прощаємо."
    - baba: "І зайчика до хати кличте — чаю з морквяним пирогом поп'ємо!"
    - fx: hearts
      on: koza
    - narrator: "От і казці кінець. Бо правду казати й миритися — найкраща сила на світі!"
    - ending: friends
